name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Renderizar HTML estático
        run: |
          mkdir -p dist
          php index.php > dist/index.html
          cp -r assets dist/assets
          cp manifest.json dist/manifest.json
          touch dist/.nojekyll

      - name: Gerar currículo em PDF
        run: |
          php curriculo.php > dist/curriculo-tmp.html
          google-chrome --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="dist/curriculo-murilo-nogueira.pdf" \
            "file://$(pwd)/dist/curriculo-tmp.html"
          rm dist/curriculo-tmp.html

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
